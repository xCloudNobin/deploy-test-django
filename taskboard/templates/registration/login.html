{% extends "taskboard/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
<div class="card" style="max-width: 420px">
  {% if form.non_field_errors %}
    <ul class="errorlist">{{ form.non_field_errors }}</ul>
  {% endif %}
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="id_username">Username</label>
    <input class="field" type="text" name="username" id="id_username" autofocus autocapitalize="none" required>
    <label for="id_password">Password</label>
    <input class="field" type="password" name="password" id="id_password" required>
    <button type="submit">Log in</button>
  </form>
</div>
{% endblock %}
