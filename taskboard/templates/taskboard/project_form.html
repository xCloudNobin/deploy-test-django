{% extends "taskboard/base.html" %}
{% block title %}{% if object %}Edit{% else %}New{% endif %} Project{% endblock %}
{% block content %}
<h1>{% if object %}Edit project{% else %}New project{% endif %}</h1>
<div class="card">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save project</button>
    <a class="btn secondary" href="{% url 'project-list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
