{% extends "taskboard/base.html" %}
{% block title %}Delete {{ task.title }}{% endblock %}
{% block content %}
<h1>Delete task</h1>
<div class="card">
  <p>Delete task <strong>{{ task.title }}</strong>? This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="danger">Delete task</button>
    <a class="btn secondary" href="{% url 'project-detail' task.project_id %}">Cancel</a>
  </form>
</div>
{% endblock %}
