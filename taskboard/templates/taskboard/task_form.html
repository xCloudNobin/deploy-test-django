{% extends "taskboard/base.html" %}
{% block title %}{% if object %}Edit{% else %}New{% endif %} Task{% endblock %}
{% block content %}
<h1>{% if object %}Edit task{% else %}New task{% endif %}</h1>
<div class="card">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save task</button>
    <a class="btn secondary" href="{% url 'task-list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
