{% extends "taskboard/base.html" %}
{% block title %}Delete {{ project.name }}{% endblock %}
{% block content %}
<h1>Delete project</h1>
<div class="card">
  <p>Delete <strong>{{ project.name }}</strong>? This removes it and its
    {{ project.tasks.count }} task(s). This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="danger">Delete project</button>
    <a class="btn secondary" href="{% url 'project-detail' project.pk %}">Cancel</a>
  </form>
</div>
{% endblock %}
